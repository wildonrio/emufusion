name: gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python3 -m pip install jsonschema
      - name: Registry validators
        run: |
          python3 tools/validate_engine_registry.py
          python3 tools/validate_phase2_registry.py
          python3 tools/validate_phase3_registry.py
      - name: Python test suite
        run: python3 -m unittest discover -s tools/tests
      - name: Frozen theme hashes
        run: |
          printf '50835cdcfe088a5db75b8aad600fd10fec2bf2ba1e4ef8e985e85d39a3e1b27d  theme/theme.qml\n2074cb37096ef325e6486d54376c4b7ebbb381656d5353f4c248cb0d7ca697b1  theme/theme.cfg\n' | shasum -a 256 -c -

  java-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Host Java tests
        run: ./unified-android/test.sh

  native-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native host tests with sanitizers
        run: ./unified-android/native/run_tests.sh
