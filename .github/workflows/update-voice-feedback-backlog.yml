name: Update voice feedback backlog

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: voice-feedback-backlog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate categorized feedback list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/update_voice_feedback_backlog.py
          --repo "$GITHUB_REPOSITORY"
          --output docs/VOICE-FEEDBACK-BACKLOG.md
      - name: Commit changed backlog
        shell: bash
        run: |
          if git diff --quiet -- docs/VOICE-FEEDBACK-BACKLOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VOICE-FEEDBACK-BACKLOG.md
          git commit -m "docs: refresh voice feedback backlog"
          git push
